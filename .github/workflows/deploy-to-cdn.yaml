name: Deploy to CDN

on:
    push:
        branches:
            - main
    pull_request:
        types: [opened, synchronize, reopened]
    workflow_dispatch:

permissions:
    id-token: write
    contents: read

jobs:
    get-branch-name:
        runs-on: ubuntu-latest
        outputs:
            branchName: ${{ steps.get_branch_name.outputs.branchName }}
            versionExtension: ${{ steps.get_branch_name.outputs.versionExtension }}
        steps:
            - name: Check out source code
              uses: actions/checkout@v6
            - name: Get branch name
              id: get_branch_name
              shell: bash
              run: |
                  branchName=${{ github.head_ref || github.ref_name }}
                  echo "branchName=$branchName" >> $GITHUB_OUTPUT
                  versionExtension=""
                  echo "versionExtension=$versionExtension" >> $GITHUB_OUTPUT
                  if [ $branchName != 'main' ]; then
                    echo "versionExtension=$versionExtension-pre.${{ github.run_number }}" >> $GITHUB_OUTPUT
                  fi

    get-version-number:
        runs-on: ubuntu-latest
        needs: [get-branch-name]
        outputs:
            full: ${{ steps.get_version_number.outputs.result }}
            base: ${{ steps.get_version_number.outputs.base }}
        steps:
            - name: Check out source code
              uses: actions/checkout@v6
            - name: Get new version number
              id: get_version_number
              shell: bash
              run: |
                  versionNumber=$(cat version.txt)
                  versionNumber="${versionNumber//$'\r'/}"
                  versionExtension=${{ needs.get-branch-name.outputs.versionExtension }}
                  echo "result=$versionNumber$versionExtension" >> $GITHUB_OUTPUT
                  echo "base=$versionNumber" >> $GITHUB_OUTPUT

    build-applet-template:
        runs-on: ubuntu-latest
        environment: dev
        needs: [get-branch-name, get-version-number]
        steps:
            - name: Check out source code
              uses: actions/checkout@v6
            - name: Login in to azure
              uses: azure/login@v3
              with:
                  client-id: ${{ secrets.AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
            - name: Get required secrets from KeyVault
              id: kvSecrets
              uses: relativityone/get-keyvault-secrets-action@v3
              with:
                  key-vault: 'fds-mfe-template-dev-kv'
                  secrets: 'ArtifactoryAccessToken'
            - name: Register Artifactory
              uses: relativityone/artifactory-setup-action@v2
              with:
                  KeyVaultName: 'fds-mfe-template-dev-kv'
                  ArtifactTypes: 'npm'
                  MetricsCredentials: ${{ secrets.DEVOPS_METRICS_SERVICE_PRINCIPAL_CREDS }}
            - name: Set up Node
              uses: actions/setup-node@v6
              with:
                  registry-url: https://relativityone.jfrog.io/artifactory/api/npm/npm-anthology
                  node-version: '24'
            - name: Install dependencies
              run: npm ci
              env:
                  NODE_AUTH_TOKEN: ${{ steps.kvSecrets.outputs.ArtifactoryAccessToken }}
            - name: Build applet
              run: npm run build
            - name: Cache Build
              uses: actions/cache/save@v5
              with:
                  path: ./dist
                  key: r1-template-${{ needs.get-version-number.outputs.full }}

    check-to-see-if-applet-should-be-published:
        runs-on: ubuntu-latest
        needs: [get-version-number, get-branch-name]
        outputs:
            result: ${{ steps.should_publish.outputs.result }}
        steps:
            - name: Verify tag name
              id: get_tag_name
              uses: actions/github-script@v8
              with:
                  script: |
                      const version = '${{ needs.get-version-number.outputs.base }}';
                      let validTag = false;
                      try {
                        await github.rest.git.getRef({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          ref: `tags/${version}`,
                          headers: {
                            'X-GitHub-Api-Version': '2022-11-28'
                          }
                        });
                        // Tag exists
                      } catch (error) {
                        if (error.status === 404) {
                          // Tag not found, creating a new one
                          validTag = true;
                        } else {
                          throw error; // rethrow the error if it's not a 404
                        }
                      }
                      return validTag;
                  result-encoding: string
            - name: Check if Applet should be published
              id: should_publish
              uses: actions/github-script@v8
              with:
                  script: |
                      if ('${{ needs.get-branch-name.outputs.branchName }}' == 'main' && '${{ steps.get_tag_name.outputs.result }}' == 'true') {
                        return true;
                      } 
                      if ('${{ needs.get-branch-name.outputs.branchName }}' != 'main') {
                        return false;
                      }
                      if ('${{ needs.get-branch-name.outputs.branchName }}' == 'main' && '${{ github.event_name }}' == 'workflow_dispatch') {
                        // allow manual trigger to publish to main branch
                        return true;
                      }
                      if ('${{ needs.get-branch-name.outputs.branchName }}' == 'main' && '${{ steps.get_tag_name.outputs.result }}' == 'false') {
                        core.setFailed('Version number in version.txt needs to be updated before publishing to main branch.')
                        return false;
                      }

    deploy-to-CDN:
        runs-on: ubuntu-latest
        environment: 'regression'
        needs:
            [check-to-see-if-applet-should-be-published, get-version-number, build-applet-template]
        if: ${{ needs.check-to-see-if-applet-should-be-published.outputs.result == 'true' }}
        steps:
            - name: Check out source code
              uses: actions/checkout@v6
            - name: Retrieve Build Cache
              uses: actions/cache/restore@v5
              with:
                  path: ./dist
                  key: r1-template-${{ needs.get-version-number.outputs.full }}
            - name: Deploy static files to CDN
              uses: relativityone/rel-cdn-infra/actions/deploy-to-cdn@v1.6.0
              with:
                  client-id: ${{ secrets.CDN_CLIENT_ID }}
                  environment: 'regression' #Environment to deploy to
                  container: 'mfe-applet-template' #The name of the container you choose
                  content-source: 'dist' #Folder for files to upload to CDN
                  overwrite-files: 'true' #controls whether files should be overwritten
                  purge-cache: 'true' #controls whether cache should be purge
